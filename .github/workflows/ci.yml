name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-pins:
    name: wait for PyPI pins
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact runtime pins on PyPI
        run: python3 .github/scripts/wait_for_pypi_pins.py

  ci:
    needs: pypi-pins
    permissions:
      contents: read
      packages: read
    uses: Economistician/eb-integration/.github/workflows/pr-gate.yml@main
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      python_versions: '["3.11", "3.12", "3.13"]'
      tooling_python_version: "3.13"
      run_precommit: true
      enable_typecheck: true
      import_module: "eb_examples"
      extras: "all"
